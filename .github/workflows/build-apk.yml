name: Build ButtonPilot APK

on:
  push:
    branches:
      - main
      - arena/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK (NO tools package)
        run: |
          echo "SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list_installed

      - name: Fix gradle wrapper - MUST
        run: |
          ls -la gradle/wrapper/
          chmod +x gradlew
          # Agar jar missing hai to download karo
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading wrapper jar..."
            mkdir -p gradle/wrapper
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar
          fi
          ls -lh gradle/wrapper/gradle-wrapper.jar
          ./gradlew --version

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace || ./gradlew test --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --info

      - name: List APKs
        if: always()
        run: |
          find . -name "*.apk" -type f | xargs ls -lh || echo "No APK found"
          cat app/build/outputs/logs/* 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ButtonPilot-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
